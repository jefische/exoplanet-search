<app-search-form (submitted)="onSearch($event)" />
<table class="table mt-4">
  <thead>
    <tr>
      @for (c of columns; track c) {
        <th>
          {{ c }}
        </th>
      }
    </tr>
  </thead>
  <tbody>
    @for (p of pagedPlanets(); track p.pl_name) {
      <tr>
        <td>
          {{ p.pl_name }}
        </td>
        <td>
          {{ p.hostname }}
        </td>
        <td>
          {{ p.disc_year }}
        </td>
        <td>
          {{ p.discoverymethod }}
        </td>
        <td>
          {{ p.pl_orbper }}
        </td>
        <td>
          {{ p.sy_dist }}
        </td>
      </tr>
    }
  </tbody>
</table>
<ngb-pagination
  [collectionSize]="filteredPlanets().length"
  [pageSize]="pageSize"
  [page]="page()"
  (pageChange)="page.set($event)"
  [maxSize]="5"
  [rotate]="true"
  [boundaryLinks]="true"
/>
